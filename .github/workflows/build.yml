name: Build Yuno Clicker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pynput

      - name: Build exe
        run: >
          pyinstaller yuno_clicker.pyw
          --onefile --windowed --noconfirm --clean
          --name "Yuno Clicker"
          --icon yuno.ico
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32

      - name: Save exe as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: Yuno-Clicker
          path: dist/Yuno Clicker.exe

      - name: Attach exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/Yuno Clicker.exe
